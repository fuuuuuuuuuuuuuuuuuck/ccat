<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; padding: 10px 12px; font: 13px Verdana, Arial, sans-serif; background: #fff; white-space: nowrap; }
  .row { margin: 6px 0; }
  label { cursor: pointer; }
  label.rowlabel { font-weight: bold; margin-right: 6px; cursor: default; }
  select { font-size: 13px; padding: 2px; }
  hr { border: 0; border-top: 1px solid #ccc; margin: 8px 0; }
  .update { background: #ffffe0; border: 1px solid #000; padding: 4px 6px; margin-bottom: 8px; }
  .update[hidden] { display: none; }
  .off { color: #999; }
  .off label { cursor: not-allowed; }
</style>
</head>
<body>
  <div id="update" class="update" hidden></div>
  <div class="row">
    <label class="rowlabel" for="rows">Display Rows:</label>
    <select id="rows">
      <option value="2">2 Rows (8 items - Default)</option>
      <option value="4">4 Rows (16 items)</option>
      <option value="6">6 Rows (24 items)</option>
      <option value="8">8 Rows (32 items)</option>
      <option value="12">12 Rows (48 items)</option>
    </select>
  </div>
  <hr />
  <div class="row"><label><input type="checkbox" data-feature="pager" /> Next page at top</label></div>
  <div class="row"><label><input type="checkbox" data-feature="builder" /> Hat Builder search</label></div>
  <div class="row"><label><input type="checkbox" data-feature="egg" /> ouu delicious 👀</label></div>
  <div class="row off"><label><input type="checkbox" disabled /> Search (BROKEN CUZ C.CAT UPDATE)</label></div>
  <script src="popup.js"></script>
</body>
</html>
